spring.application.name=TrimpleCars

# Database URL for H2 in-memory (for local development)
spring.datasource.url=

# JDBC Driver class name (for H2 database)
spring.datasource.driverClassName= 

# Database username and password (default for H2)
spring.datasource.username=
spring.datasource.password=

# JPA (Hibernate) dialect for H2
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Enable H2 Console for local testing (accessible in browser at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate DDL Auto - update schema automatically (use 'create' for fresh schema on each restart)
spring.jpa.hibernate.ddl-auto=update

# Show SQL statements in the console
spring.jpa.show-sql=true

# Format SQL output for readability
spring.jpa.properties.hibernate.format_sql=true

# Disable hibernate's second-level cache (optional)
spring.jpa.properties.hibernate.cache.use_second_level_cache=false

# Display the SQL query logs to the console
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
